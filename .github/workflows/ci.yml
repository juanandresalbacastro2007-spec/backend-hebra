name: CI - HebraTech Backend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hebratech_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Esperar a MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; do
            echo "Esperando a MySQL..."
            sleep 2
          done

      - name: Cargar esquema de base de datos (si aplica)
        run: |
          if [ -f schema.sql ]; then
            mysql -h 127.0.0.1 -P 3306 -uroot -proot hebratech_test < schema.sql
          fi

      - name: Lint con flake8
        run: flake8 . --max-line-length=120 --exclude=venv,migrations,__pycache__

      - name: Verificar migraciones pendientes
        env:
          DB_NAME: hebratech_test
          DB_USER: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          SECRET_KEY: ci-test-secret-key
          DEBUG: 'False'
        run: python manage.py makemigrations --check --dry-run

      - name: Ejecutar tests
        env:
          DB_NAME: hebratech_test
          DB_USER: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          SECRET_KEY: ci-test-secret-key
          DEBUG: 'False'
        run: python manage.py test